<!-- Componente Reutilizable: Datos Demográficos del Paciente -->
<div class="card">
  <div class="card-header">
    <span class="card-title">👤 Datos del Paciente</span>
    <span class="badge badge-neutral">Identificación y Biometría</span>
  </div>
  <div class="form-grid">
    <div class="form-group">
      <label for="cedula_id">Cédula / Documento ID *</label>
      <input type="text" id="cedula_id" name="cedula_id" class="form-control" placeholder="Ej. 001-1234567-8" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="nombre">Nombre Completo del Paciente *</label>
      <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
    </div>
    <div class="form-group">
      <label for="edad">Edad (Años) *</label>
      <input type="number" id="edad" name="edad" class="form-control" min="0" max="120" value="50" required>
    </div>
    <div class="form-group">
      <label for="sexo">Sexo Biológico *</label>
      <select id="sexo" name="sexo" class="form-control" required>
        <option value="F" selected>Femenino (F)</option>
        <option value="M">Masculino (M)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="medico_solicitante">Médico Solicitante</label>
      <input type="text" id="medico_solicitante" name="medico_solicitante" class="form-control" placeholder="Ej. Dr. Consulta Externa">
    </div>
  </div>
</div>
